[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dw-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for Deutsche Welle news (dw.com) — headlines, search, articles & topics in 31 languages"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
dw-mcp = "dw_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dw_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real https://www.dw.com site"]
